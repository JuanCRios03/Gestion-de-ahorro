<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Ahorro</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #222; }
      header { background: #1f4ea1; color: white; padding: 12px 20px; }
      main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
      section { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 12px; }
      h2 { margin: 0 0 8px 0; font-size: 1.05rem; }
      form { display: grid; gap: 8px; }
      input, button, select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
      button { background: #1f4ea1; color: white; cursor: pointer; }
      ul { margin: 0; padding-left: 18px; max-height: 190px; overflow: auto; }
      .summary p { margin: 5px 0; }
      .badge { font-size: 0.8rem; padding: 2px 6px; border-radius: 10px; background: #e5eefc; margin-left: 4px; }
      .small { background: #ffe5cc; }
      code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header><h1>Gestión de ahorro y gastos personales</h1></header>
    <main id="root"></main>

    <script src="/vendor/react/react.production.min.js"></script>
    <script src="/vendor/react-dom/react-dom.production.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
